name: Dienstregeling bijwerken

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/data.yml]
  schedule:
    - cron: "17 1 * * *" # elke nacht 01:17 UTC; Renfe heeft per dag andere ritten

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build.py public
      - run: python3 scripts/build_renfe.py public/renfe
      - run: python3 scripts/build_italia.py public/italia
      - run: python3 scripts/build_dated.py oebb public/oebb
      - run: python3 scripts/build_dated.py hzpp public/hzpp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
